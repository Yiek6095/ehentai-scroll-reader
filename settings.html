<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阅读模式设置</title><link rel="stylesheet" href="settings.css"></head>
<body><main><h1>阅读模式</h1><p>两种模式均保留整本页面，并定位到你打开的页码，可向上或向下阅读。图片加载失败时会重新获取地址并自动重试一次；仍失败可手动重试。</p>
<form id="settings"><fieldset disabled><legend>两种模式</legend>
<label><input type="radio" name="mode" value="batch"><span><strong>每次加载 10 页 · 默认</strong><small>随滚动按每批 10 页加载，支持向上和向下阅读，无需点击按钮。</small></span></label>
<label><input type="radio" name="mode" value="all"><span><strong>全部加载</strong><small>整本图片并行加载，无需滚动触发；消耗更多流量与内存。</small></span></label>
</fieldset><button type="submit" disabled>应用并刷新当前阅读页</button></form>
<p id="status" role="status" aria-live="polite">正在读取设置…</p><p class="hint">选择模式和语言后，点击应用一起保存并刷新当前阅读页。</p>
</main><script src="i18n.js"></script><script src="settings.js"></script></body></html>
